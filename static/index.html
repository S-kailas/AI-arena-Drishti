<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>AI Debate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #111;
            color: #eee;

            min-height: 100vh;
        }

        .container {
            max-width: 900px;

            margin: auto;

            padding: 40px 20px;
        }

        h1 {
            text-align: center;

            margin-bottom: 30px;
        }

        .topic-box {
            display: flex;

            gap: 10px;
        }

        input {
            flex: 1;

            padding: 15px;

            background: #1d1d1d;

            border: 1px solid #444;

            border-radius: 8px;

            color: white;

            font-size: 16px;
        }

        button {
            padding: 15px 25px;

            border: none;

            border-radius: 8px;

            background: #444;

            color: white;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .topic {
            margin-top: 25px;

            text-align: center;

            color: #aaa;
        }

        .debate {
            margin-top: 30px;
        }

        .message {
            padding: 20px;

            margin-bottom: 15px;

            border-radius: 12px;

            line-height: 1.6;

            white-space: pre-wrap;
        }

        .a {
            background: #18243a;

            border-left: 4px solid #4c8bf5;
        }

        .b {
            background: #351d1d;

            border-left: 4px solid #f05252;
        }

        .speaker {
            font-weight: bold;

            margin-bottom: 10px;
        }

        .status {
            text-align: center;

            margin-top: 20px;

            color: #888;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>⚔️ AI Debate</h1>


    <div class="topic-box">

        <input
            id="topic"
            placeholder="Enter a debate topic..."
        >

        <button
            id="start"
            onclick="startDebate()"
        >
            Start Debate
        </button>

    </div>


    <div
        id="topicDisplay"
        class="topic"
    ></div>


    <div
        id="debate"
        class="debate"
    ></div>


    <div
        id="status"
        class="status"
    ></div>

</div>


<script>

async function startDebate() {

    const topicInput =
        document.getElementById("topic");

    const startButton =
        document.getElementById("start");

    const debate =
        document.getElementById("debate");

    const status =
        document.getElementById("status");

    const topic =
        topicInput.value.trim();


    if (!topic) {

        alert("Enter a topic first.");

        return;
    }


    // Reset UI

    debate.innerHTML = "";

    status.textContent =
        "Debate starting...";

    startButton.disabled = true;


    document.getElementById(
        "topicDisplay"
    ).textContent =
        "Topic: " + topic;


    try {

        const response = await fetch(
            "/debate",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    topic: topic
                })
            }
        );


        if (!response.ok) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();


        let buffer = "";

        let currentMessage = null;


        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {
                break;
            }


            buffer += decoder.decode(
                value,
                {
                    stream: true
                }
            );


            const lines =
                buffer.split("\n");

            buffer =
                lines.pop();


            for (const line of lines) {

                if (!line.trim()) {
                    continue;
                }


                const data =
                    JSON.parse(line);


                // ------------------
                // New speaker
                // ------------------

                if (
                    data.type ===
                    "speaker"
                ) {

                    currentMessage =
                        document.createElement(
                            "div"
                        );


                    currentMessage.className =
                        "message " +
                        (
                            data.speaker === "A"
                                ? "a"
                                : "b"
                        );


                    const speaker =
                        document.createElement(
                            "div"
                        );


                    speaker.className =
                        "speaker";


                    speaker.textContent =
                        data.speaker === "A"
                            ? "🟦 Debater A — PRO"
                            : "🟥 Debater B — CON";


                    const text =
                        document.createElement(
                            "div"
                        );


                    currentMessage.appendChild(
                        speaker
                    );

                    currentMessage.appendChild(
                        text
                    );


                    debate.appendChild(
                        currentMessage
                    );


                    // Keep latest response visible

                    currentMessage
                        .scrollIntoView({
                            behavior: "smooth"
                        });
                }


                // ------------------
                // Token
                // ------------------

                else if (
                    data.type ===
                    "token"
                ) {

                    if (!currentMessage) {
                        continue;
                    }


                    const text =
                        currentMessage
                            .children[1];


                    text.textContent +=
                        data.token;


                    window.scrollTo(
                        0,
                        document.body.scrollHeight
                    );
                }


                // ------------------
                // Finished
                // ------------------

                else if (
                    data.type ===
                    "done"
                ) {

                    status.textContent =
                        "Debate finished.";
                }

            }

        }

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Error: " +
            error.message;

    }


    startButton.disabled = false;

}

</script>

</body>

</html>
